name: paperscan
description: PaperScan document scanner and PDF toolkit.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mlkit_document_scanner: ^0.4.1
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.3.5
  file_picker: ^8.3.7
  image: ^4.5.3
  uuid: ^4.5.1
  intl: ^0.20.2
  in_app_purchase: ^3.2.1
  permission_handler: ^11.3.1
  pdfrx: ^1.0.101
  flutter_image_compress: ^2.4.0
  archive: ^3.6.1
  google_mlkit_text_recognition: ^0.16.0
  syncfusion_flutter_pdf: ^32.2.9
  google_mobile_ads: ^5.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
dependency_overrides:
  archive: ^4.7.0
  uuid: ^4.5.1
flutter:
  uses-material-design: true